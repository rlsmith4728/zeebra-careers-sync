name: Sync Careers CMS

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours; adjust to taste
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: node sync.js
        env:
          WEBFLOW_API_TOKEN: ${{ secrets.ZEEBRA_JOBLISTINGS_API_TOKEN }}
          WEBFLOW_COLLECTION_ID: ${{ vars.ZEEBRA_JOBLISTING_COLLECTION_ID }}
